<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIVO - צפייה בסרטים וסדרות</title>
  <meta name="theme-color" content="#0A0D14">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body {
      background: radial-gradient(circle at 50% 20%, #151D2E 0%, #0A0D14 100%);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
      text-align: center;
    }
    .card {
      background: rgba(19, 25, 38, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .icon-badge {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #1E90FF 0%, #0052CC 100%);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      font-size: 38px;
      box-shadow: 0 10px 25px rgba(30, 144, 255, 0.35);
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      color: #FFFFFF;
    }
    p {
      font-size: 15px;
      color: #94A3B8;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 15px 20px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      margin-bottom: 12px;
      transition: transform 0.15s ease, background 0.2s ease;
      cursor: pointer;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background: #1E90FF;
      color: #FFFFFF;
      box-shadow: 0 8px 20px rgba(30, 144, 255, 0.3);
    }
    .btn-primary:hover {
      background: #0077F0;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.07);
      color: #E2E8F0;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }
    .footer-note {
      font-size: 12px;
      color: #64748B;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-badge">🎬</div>
    <h1>MIVO TV</h1>
    <p id="desc">פותח את התוכן המשותף באפליקציית MIVO...<br>אם האפליקציה לא נפתחה אוטומטית, לחץ על הכפתור למטה.</p>
    
    <a href="#" id="openAppBtn" class="btn btn-primary">▶ פתח באפליקציית MIVO</a>
    <a href="https://t.me/MIVO_app" target="_blank" class="btn btn-secondary">📥 הורד את אפליקציית MIVO (APK)</a>
    
    <div class="footer-note">MIVO · חוויית צפייה חכמה ומהירה</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const start = params.get('start') || '';
    
    // בונה קישור ישיר לאפליקציה (Custom Scheme)
    let appDeepLink = 'mivo://open';
    if (start) {
      appDeepLink = 'mivo://open?start=' + encodeURIComponent(start);
    }
    
    document.getElementById('openAppBtn').href = appDeepLink;
    
    // ניסיון פתיחה אוטומטית בעת טעינת הדף
    if (start) {
      setTimeout(() => {
        window.location.href = appDeepLink;
      }, 300);
    }
  </script>
</body>
</html>
